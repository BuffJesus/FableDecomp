name: docs-consistency

# Python-only checks that need neither VC7.1 nor a retail install:
#  * README / rebuild README coverage numbers must equal the generated dashboard
#  * docs links must resolve and no root scratch may be tracked
#  * pure-Python pipeline unit tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coverage numbers match the generated dashboard
        run: python tools/update_readme_progress.py --check
      - name: Docs links resolve, no root scratch tracked
        # --check-findings joins once FINDINGS_LOG facts are re-homed (ROADMAP lane a)
        run: python tools/docs_reorg.py --check-links --check-root
      - name: Pure-Python pipeline tests
        run: |
          python -m pip install pytest
          python -m pytest tools/decomp_pipeline/tests tools/script_recovery -q -k "not vc71 and not retail"
