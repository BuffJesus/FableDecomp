# Oakvale Reborn -- single source of truth for the rewritten childhood intro.
# Consumed by tools/oakvale_reborn/build_custom_intro.py and cs_lint.py. See
# STORY.md for the beats and the plan for the phase order. Paths are relative
# to the OakvaleReborn directory.
project: OakvaleReborn
game_root: "C:/Programs/Steam/steamapps/common/Fable The Lost Chapters"
lua: FSE                                   # Lua tree bundled as NoviCompatibility/
bundle_template: local-candidate-v4        # under work/new-oakvale-original-fse-20260912
sidecar_source: sidecar-abi-v2             # Release/FableScriptExtender.dll = NoviCompatibility.dll

# ElevenLabs voices per NarratorList speaker (speaker must be a retail narrator
