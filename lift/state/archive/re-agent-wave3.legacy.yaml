project_profile:
  hook_patterns: []
  stub_patterns: []
  stub_markers: ["TODO_LIFT", "NOT_IMPLEMENTED"]
  stub_call_prefix: ""
  class_macro: ""
  source_root: "D:/Documents/FableTLC/lift"
  source_extensions: [".cpp", ".h", ".hpp"]
  hooks_csv: null
  type_layouts_path: "D:/Documents/FableTLC/ghidra_out/struct_layouts_egor.tsv"

llm:
  provider: "codex"
  model: "gpt-5.4"
  max_tokens: 8192
  temperature: 0.0
  timeout_s: 1800

backend:
  type: "ghidra-bridge"
  cli_path: "D:/Documents/FableTLC/lift/bin/ghidra_cli.cmd"
  timeout_s: 180

parity:
  enabled: true
  call_count_warn_diff: 3
  inline_wrapper_autoskip: false
  cache_dir: "D:/Documents/FableTLC/lift/.cache/re-agent-parity"

orchestrator:
  max_review_rounds: 4
  max_functions_per_class: 6
  objective_verifier_enabled: true
  objective_call_count_tolerance: 3
  objective_control_flow_tolerance: 2

output:
  report_dir: "D:/Documents/FableTLC/lift/re-agent-wave3-reports"
  log_dir: "D:/Documents/FableTLC/lift/re-agent-wave3-reports/logs"
  session_file: "D:/Documents/FableTLC/lift/re-agent-wave3-progress.json"
  format: "json"
